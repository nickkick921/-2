<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070b1d">
  <title>운석 피하기</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #070b1d; color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }
    body { touch-action: none; user-select: none; -webkit-user-select: none; }
    #game {
      position: fixed; inset: 0; width: 100%; height: 100%; display: block;
      touch-action: none;
    }
    .hud {
      position: fixed; z-index: 2; top: max(16px, env(safe-area-inset-top));
      left: 16px; right: 16px; display: flex; justify-content: space-between;
      gap: 12px; pointer-events: none;
    }
    .hud-box {
      min-width: 104px; padding: 10px 14px; border: 1px solid #ffffff24;
      border-radius: 16px; background: #101936bb; backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px #0003;
    }
    .hud-label { color: #aab8df; font-size: 11px; letter-spacing: .12em; }
    .hud-value { margin-top: 2px; font-size: 22px; line-height: 1.15; font-weight: 800; font-variant-numeric: tabular-nums; }
    .center-screen {
      position: fixed; z-index: 3; inset: 0; display: grid; place-items: center;
      padding: 24px; background: #05091acc; backdrop-filter: blur(5px);
    }
    .panel {
      width: min(100%, 360px); padding: 30px 24px 26px; text-align: center;
      border: 1px solid #8da8ff45; border-radius: 26px;
      background: linear-gradient(160deg, #18264c, #0c1430 72%);
      box-shadow: 0 24px 80px #0008;
    }
    .ship-icon { font-size: 42px; filter: drop-shadow(0 0 14px #6ee7ff88); }
    h1 { margin: 10px 0 8px; font-size: 28px; letter-spacing: -.04em; }
    .message { margin: 0 auto 22px; color: #c1cbed; line-height: 1.65; font-size: 14px; }
    button {
      width: 100%; border: 0; border-radius: 15px; padding: 15px 18px;
      color: #081026; background: linear-gradient(100deg, #79efff, #a8ffcf);
      font-size: 16px; font-weight: 900; cursor: pointer;
      box-shadow: 0 8px 24px #64e8ff38;
    }
    button:active { transform: scale(.98); }
    .hint { margin-top: 16px; color: #899acb; font-size: 12px; }
    .hidden { display: none; }
    @media (min-width: 700px) {
      .hud { left: 24px; right: 24px; }
      .hud-box { min-width: 130px; padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="운석을 피하는 우주선 게임"></canvas>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">SCORE</div>
      <div class="hud-value" id="score">0</div>
    </div>
    <div class="hud-box" style="text-align:right">
      <div class="hud-label">SURVIVAL TIME</div>
      <div class="hud-value"><span id="time">0.0</span><span style="font-size:13px;font-weight:600"> 초</span></div>
    </div>
  </div>

  <div class="center-screen" id="startScreen">
    <div class="panel">
      <div class="ship-icon">🚀</div>
      <h1>운석 피하기</h1>
      <p class="message">위에서 떨어지는 운석을 피해 최대한 오래 살아남으세요!<br>운석에 부딪히면 게임이 끝납니다.</p>
      <button id="startButton">게임 시작</button>
      <div class="hint">손가락으로 드래그 · PC는 ← → 방향키</div>
    </div>
  </div>

  <div class="center-screen hidden" id="gameOverScreen">
    <div class="panel">
      <div class="ship-icon">💥</div>
      <h1>게임 오버!</h1>
      <p class="message">운석과 충돌했습니다.<br>이번 기록은 <strong id="finalScore">0점</strong>입니다.</p>
      <button id="restartButton">다시 도전하기</button>
      <div class="hint">방향을 빠르게 바꾸며 운석을 피하세요!</div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const timeEl = document.getElementById('time');
      const startScreen = document.getElementById('startScreen');
      const gameOverScreen = document.getElementById('gameOverScreen');
      const finalScoreEl = document.getElementById('finalScore');

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = 1;
      let state = 'ready'; // ready, running, gameover
      let lastFrame = 0;
      let elapsed = 0;
      let spawnTimer = 0;
      let meteors = [];
      let stars = [];
      let pointerDown = false;
      const keys = { left: false, right: false };
      const player = { x: width / 2, y: height - 88, width: 48, height: 48, speed: 440, targetX: width / 2 };

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        player.y = height - Math.max(76, height * 0.105);
        player.x = clamp(player.x, 28, width - 28);
        player.targetX = clamp(player.targetX, 28, width - 28);
        createStars();
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function createStars() {
        const count = Math.max(45, Math.floor(width * height / 8500));
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.8 + 0.3,
          speed: Math.random() * 24 + 10,
          alpha: Math.random() * 0.6 + 0.2
        }));
      }

      function startGame() {
        elapsed = 0;
        spawnTimer = 0.35;
        meteors = [];
        player.x = width / 2;
        player.targetX = player.x;
        scoreEl.textContent = '0';
        timeEl.textContent = '0.0';
        state = 'running';
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        lastFrame = performance.now();
      }

      function endGame() {
        if (state !== 'running') return;
        state = 'gameover';
        const score = Math.floor(elapsed * 10);
        finalScoreEl.textContent = score + '점';
        gameOverScreen.classList.remove('hidden');
      }

      function spawnMeteor() {
        const radius = 13 + Math.random() * 15;
        const edge = radius + 8;
        const difficulty = Math.min(elapsed / 35, 1.7);
        meteors.push({
          x: edge + Math.random() * Math.max(1, width - edge * 2),
          y: -radius - 8,
          radius,
          speed: (170 + Math.random() * 95) * (1 + difficulty * 0.72),
          drift: (Math.random() - 0.5) * (18 + difficulty * 18),
          rotation: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 2.5,
          bumps: Array.from({ length: 8 }, () => 0.78 + Math.random() * 0.35)
        });
      }

      function update(dt) {
        for (const star of stars) {
          star.y += star.speed * dt;
          if (star.y > height) { star.y = -3; star.x = Math.random() * width; }
        }
        if (state !== 'running') return;

        elapsed += dt;
        scoreEl.textContent = String(Math.floor(elapsed * 10));
        timeEl.textContent = elapsed.toFixed(1);

        const direction = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        if (direction !== 0) {
          player.x += direction * player.speed * dt;
          player.targetX = player.x;
        } else {
          const diff = player.targetX - player.x;
          player.x += diff * Math.min(1, dt * 14);
        }
        player.x = clamp(player.x, 27, width - 27);

        // 시간이 지날수록 운석이 더 자주 나타납니다.
        const spawnInterval = Math.max(0.22, 0.88 - elapsed * 0.012);
        spawnTimer -= dt;
        while (spawnTimer <= 0) {
          spawnMeteor();
          spawnTimer += spawnInterval * (0.72 + Math.random() * 0.56);
          if (elapsed > 22 && Math.random() < Math.min(0.35, (elapsed - 22) / 80)) spawnMeteor();
        }

        for (const meteor of meteors) {
          meteor.y += meteor.speed * dt;
          meteor.x += meteor.drift * dt;
          meteor.rotation += meteor.spin * dt;
          if (meteor.x < meteor.radius || meteor.x > width - meteor.radius) meteor.drift *= -1;

          // 우주선 중심과 운석 사이의 거리를 확인합니다.
          const dx = meteor.x - player.x;
          const dy = meteor.y - player.y;
          const hitDistance = meteor.radius + 17;
          if (dx * dx + dy * dy < hitDistance * hitDistance) {
            endGame();
            break;
          }
        }
        meteors = meteors.filter(m => m.y < height + m.radius + 10);
      }

      function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, '#080d25');
        gradient.addColorStop(1, '#111b3b');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        for (const star of stars) {
          ctx.globalAlpha = star.alpha;
          ctx.fillStyle = '#d9e8ff';
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // 은은한 우주 성운
        const glow = ctx.createRadialGradient(width * 0.5, height * 0.55, 0, width * 0.5, height * 0.55, Math.max(width, height) * 0.65);
        glow.addColorStop(0, '#344b8b20');
        glow.addColorStop(1, '#344b8b00');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);
      }

      function drawShip() {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.shadowColor = '#5deaff';
        ctx.shadowBlur = 18;

        // 엔진 불꽃
        ctx.fillStyle = '#ffae57';
        ctx.beginPath();
        ctx.moveTo(-8, 14);
        ctx.lineTo(0, 34 + Math.random() * 5);
        ctx.lineTo(8, 14);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ffe88a';
        ctx.beginPath();
        ctx.moveTo(-4, 15);
        ctx.lineTo(0, 27 + Math.random() * 4);
        ctx.lineTo(4, 15);
        ctx.closePath();
        ctx.fill();

        // 우주선 본체
        ctx.fillStyle = '#d9f7ff';
        ctx.beginPath();
        ctx.moveTo(0, -25);
        ctx.quadraticCurveTo(8, -10, 13, 9);
        ctx.lineTo(20, 18);
        ctx.lineTo(9, 15);
        ctx.lineTo(0, 20);
        ctx.lineTo(-9, 15);
        ctx.lineTo(-20, 18);
        ctx.lineTo(-13, 9);
        ctx.quadraticCurveTo(-8, -10, 0, -25);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#4cbde8';
        ctx.beginPath();
        ctx.ellipse(0, -5, 5.5, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawMeteor(meteor) {
        ctx.save();
        ctx.translate(meteor.x, meteor.y);
        ctx.rotate(meteor.rotation);
        ctx.shadowColor = '#ff895c88';
        ctx.shadowBlur = 12;
        const colors = ctx.createRadialGradient(-meteor.radius * 0.35, -meteor.radius * 0.4, 2, 0, 0, meteor.radius * 1.3);
        colors.addColorStop(0, '#d8b08d');
        colors.addColorStop(0.55, '#9b6c62');
        colors.addColorStop(1, '#563d59');
        ctx.fillStyle = colors;
        ctx.beginPath();
        for (let i = 0; i < meteor.bumps.length; i++) {
          const angle = (i / meteor.bumps.length) * Math.PI * 2;
          const r = meteor.radius * meteor.bumps[i];
          const x = Math.cos(angle) * r;
          const y = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#493e50aa';
        ctx.beginPath();
        ctx.arc(-meteor.radius * 0.28, -meteor.radius * 0.08, meteor.radius * 0.2, 0, Math.PI * 2);
        ctx.arc(meteor.radius * 0.32, meteor.radius * 0.25, meteor.radius * 0.13, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function draw() {
        drawBackground();
        for (const meteor of meteors) drawMeteor(meteor);
        if (state !== 'ready') drawShip();
      }

      function frame(now) {
        const dt = Math.min((now - lastFrame) / 1000 || 0, 0.04);
        lastFrame = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      function movePlayerTo(clientX) {
        const rect = canvas.getBoundingClientRect();
        player.targetX = clamp(clientX - rect.left, 27, width - 27);
      }

      canvas.addEventListener('pointerdown', (event) => {
        if (state === 'ready') startGame();
        if (state === 'gameover') return;
        pointerDown = true;
        canvas.setPointerCapture(event.pointerId);
        movePlayerTo(event.clientX);
      });
      canvas.addEventListener('pointermove', (event) => {
        if (pointerDown && state === 'running') movePlayerTo(event.clientX);
      });
      function stopPointer() { pointerDown = false; }
      canvas.addEventListener('pointerup', stopPointer);
      canvas.addEventListener('pointercancel', stopPointer);
      canvas.addEventListener('lostpointercapture', stopPointer);

      window.addEventListener('keydown', (event) => {
        if (['ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
        if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') keys.left = true;
        if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') keys.right = true;
        if ((event.key === 'Enter' || event.key === ' ') && state !== 'running') startGame();
      });
      window.addEventListener('keyup', (event) => {
        if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') keys.left = false;
        if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') keys.right = false;
      });
      window.addEventListener('blur', () => { keys.left = false; keys.right = false; pointerDown = false; });
      window.addEventListener('resize', resize);
      document.getElementById('startButton').addEventListener('click', startGame);
      document.getElementById('restartButton').addEventListener('click', startGame);

      resize();
      lastFrame = performance.now();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
