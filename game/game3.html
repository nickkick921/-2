<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>리그 오브 레전드 챔피언 이름 맞히기</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09111f;
      --panel: #121f33;
      --panel-2: #1a2b43;
      --gold: #e7c46a;
      --gold-dark: #9e7b31;
      --text: #f4f6fb;
      --muted: #aab6c8;
      --green: #45c58a;
      --red: #ff7373;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, "Malgun Gothic", "맑은 고딕", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, #1a3657 0, transparent 42%),
        linear-gradient(160deg, #08101d, #101c2d 55%, #080e18);
    }

    button { font: inherit; }

    .game {
      width: min(100%, 560px);
      padding: 25px;
      border: 1px solid rgba(231, 196, 106, .45);
      border-radius: 22px;
      background: rgba(18, 31, 51, .96);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .42);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 5vw, 2.1rem);
      line-height: 1.25;
    }

    .description {
      margin: 10px 0 22px;
      color: var(--muted);
      font-size: .95rem;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 700;
    }

    .status-bar strong { color: var(--gold); }

    .progress-track {
      height: 8px;
      margin-bottom: 20px;
      overflow: hidden;
      border-radius: 99px;
      background: #26364c;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #b58b3e, #f1d783);
      transition: width .25s ease;
    }

    .portrait-wrap {
      position: relative;
      width: min(100%, 300px);
      aspect-ratio: 1 / 1;
      margin: 0 auto 20px;
      overflow: hidden;
      border: 3px solid var(--gold-dark);
      border-radius: 16px;
      background: #0a1422;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    }

    .portrait {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(13px) brightness(.78);
      transform: scale(1.08);
      transition: filter .35s ease, transform .35s ease;
    }

    .portrait.revealed {
      filter: blur(0) brightness(1);
      transform: scale(1);
    }

    .image-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: .9rem;
      pointer-events: none;
    }

    .question {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 800;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .choice {
      min-height: 54px;
      padding: 12px 10px;
      border: 1px solid #3b506b;
      border-radius: 12px;
      color: var(--text);
      background: var(--panel-2);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    .choice:focus-visible, .main-button:focus-visible {
      outline: 3px solid #f1d783;
      outline-offset: 3px;
    }

    .choice:not(:disabled):active { transform: scale(.98); }
    .choice:not(:disabled):hover { border-color: var(--gold); background: #243a58; }
    .choice:disabled { cursor: default; opacity: .9; }
    .choice.correct { border-color: var(--green); background: rgba(27, 112, 78, .4); }
    .choice.wrong { border-color: var(--red); background: rgba(135, 45, 55, .38); }

    .feedback {
      min-height: 52px;
      margin: 15px 0 5px;
      padding: 12px;
      border-radius: 12px;
      color: var(--muted);
      background: rgba(4, 10, 18, .35);
      line-height: 1.5;
      font-weight: 700;
    }

    .feedback.good { color: #82e3b4; }
    .feedback.bad { color: #ff9c9c; }

    .main-button {
      width: 100%;
      min-height: 52px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      color: #1b1a14;
      background: linear-gradient(135deg, #f3d985, #c99d48);
      font-size: 1.02rem;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .main-button:disabled {
      color: #8993a0;
      background: #354256;
      cursor: not-allowed;
    }

    .hidden { display: none !important; }

    .result-score {
      margin: 18px 0 8px;
      color: var(--gold);
      font-size: clamp(2.5rem, 12vw, 4rem);
      font-weight: 900;
    }

    .result-message {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.6;
    }

    .error-message {
      margin: 18px 0 0;
      color: #ffaaaa;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .footer-note {
      margin: 18px 0 0;
      color: #7f8da2;
      font-size: .75rem;
      line-height: 1.5;
    }

    @media (max-width: 390px) {
      .game { padding: 19px 14px; }
      .choice { min-height: 50px; font-size: .93rem; }
      .portrait-wrap { width: min(100%, 260px); }
    }
  </style>
</head>
<body>
  <main class="game">
    <p class="eyebrow">LEAGUE OF LEGENDS</p>
    <h1>챔피언 이름 맞히기</h1>
    <p class="description">흐릿한 챔피언을 보고 정답을 골라 보세요!</p>

    <section id="loadingArea" aria-live="polite">
      <p>챔피언 데이터를 불러오는 중입니다...</p>
    </section>

    <section id="quizArea" class="hidden">
      <div class="status-bar">
        <span>문제 <strong id="questionNumber">1</strong> / 10</span>
        <span>점수 <strong id="score">0</strong>점</span>
      </div>
      <div class="progress-track" aria-label="진행 상황">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <div class="portrait-wrap">
        <img id="championImage" class="portrait" src="" alt="흐리게 처리된 챔피언 이미지" />
        <div id="imageLoading" class="image-loading">이미지 불러오는 중...</div>
      </div>

      <p class="question">이 챔피언의 이름은 무엇일까요?</p>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback" aria-live="polite">정답이라고 생각하는 이름을 선택하세요.</div>
      <button id="nextButton" class="main-button" type="button" disabled>다음 문제</button>
    </section>

    <section id="resultArea" class="hidden" aria-live="polite">
      <p class="eyebrow">QUIZ COMPLETE</p>
      <h2>퀴즈 완료!</h2>
      <div id="finalScore" class="result-score">0 / 10</div>
      <p id="resultMessage" class="result-message"></p>
      <button id="restartButton" class="main-button" type="button">다시 도전하기</button>
    </section>

    <p id="errorMessage" class="error-message hidden"></p>
    <p class="footer-note">챔피언 정보와 이미지는 Riot Games Data Dragon을 사용합니다.</p>
  </main>

  <script>
    // Riot Games Data Dragon 챔피언 데이터 주소
    const DATA_URL = "https://ddragon.leagueoflegends.com/cdn/16.17.1/data/ko_KR/champion.json";
    const IMAGE_BASE_URL = "https://ddragon.leagueoflegends.com/cdn/16.17.1/img/champion/";
    const TOTAL_QUESTIONS = 10;

    const loadingArea = document.getElementById("loadingArea");
    const quizArea = document.getElementById("quizArea");
    const resultArea = document.getElementById("resultArea");
    const errorMessage = document.getElementById("errorMessage");
    const questionNumber = document.getElementById("questionNumber");
    const scoreElement = document.getElementById("score");
    const progressFill = document.getElementById("progressFill");
    const championImage = document.getElementById("championImage");
    const imageLoading = document.getElementById("imageLoading");
    const choicesElement = document.getElementById("choices");
    const feedbackElement = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");
    const finalScore = document.getElementById("finalScore");
    const resultMessage = document.getElementById("resultMessage");
    const restartButton = document.getElementById("restartButton");

    let allChampions = [];
    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let hasAnswered = false;

    // 배열의 순서를 무작위로 섞습니다.
    function shuffle(array) {
      const copied = [...array];
      for (let i = copied.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[randomIndex]] = [copied[randomIndex], copied[i]];
      }
      return copied;
    }

    // 정답 1개와 오답 3개를 골라 선택지를 만듭니다.
    function makeQuestions(champions) {
      const selectedChampions = shuffle(champions).slice(0, TOTAL_QUESTIONS);

      return selectedChampions.map((champion) => {
        const wrongAnswers = shuffle(
          champions.filter((item) => item.id !== champion.id)
        ).slice(0, 3);

        return {
          answer: champion,
          choices: shuffle([champion, ...wrongAnswers])
        };
      });
    }

    function showQuestion() {
      hasAnswered = false;
      const question = questions[currentQuestionIndex];
      const imageUrl = IMAGE_BASE_URL + question.answer.image.full;

      questionNumber.textContent = String(currentQuestionIndex + 1);
      scoreElement.textContent = String(score);
      progressFill.style.width = `${(currentQuestionIndex / TOTAL_QUESTIONS) * 100}%`;

      championImage.classList.remove("revealed");
      championImage.alt = "흐리게 처리된 챔피언 이미지";
      imageLoading.textContent = "이미지 불러오는 중...";
      imageLoading.classList.remove("hidden");
      championImage.src = imageUrl;

      championImage.onload = () => imageLoading.classList.add("hidden");
      championImage.onerror = () => {
        imageLoading.textContent = "이미지를 불러오지 못했습니다.";
      };

      choicesElement.innerHTML = "";
      question.choices.forEach((champion) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.textContent = champion.name;
        button.addEventListener("click", () => chooseAnswer(champion.id, button));
        choicesElement.appendChild(button);
      });

      feedbackElement.textContent = "정답이라고 생각하는 이름을 선택하세요.";
      feedbackElement.className = "feedback";
      nextButton.disabled = true;
      nextButton.textContent = currentQuestionIndex === TOTAL_QUESTIONS - 1
        ? "결과 보기"
        : "다음 문제";
    }

    function chooseAnswer(selectedId, selectedButton) {
      if (hasAnswered) return;
      hasAnswered = true;

      const question = questions[currentQuestionIndex];
      const isCorrect = selectedId === question.answer.id;
      const choiceButtons = choicesElement.querySelectorAll("button");

      // 선택지를 모두 비활성화하고 정답을 표시합니다.
      choiceButtons.forEach((button, index) => {
        button.disabled = true;
        if (question.choices[index].id === question.answer.id) {
          button.classList.add("correct");
        }
      });

      championImage.classList.add("revealed");
      championImage.alt = question.answer.name;

      if (isCorrect) {
        score += 1;
        scoreElement.textContent = String(score);
        feedbackElement.textContent = `정답입니다! ${question.answer.name} (+1점)`;
        feedbackElement.className = "feedback good";
      } else {
        selectedButton.classList.add("wrong");
        feedbackElement.textContent = `아쉽네요! 정답은 ${question.answer.name}입니다.`;
        feedbackElement.className = "feedback bad";
      }

      nextButton.disabled = false;
      progressFill.style.width = `${((currentQuestionIndex + 1) / TOTAL_QUESTIONS) * 100}%`;
    }

    function showResult() {
      quizArea.classList.add("hidden");
      resultArea.classList.remove("hidden");
      finalScore.textContent = `${score} / ${TOTAL_QUESTIONS}`;

      if (score === TOTAL_QUESTIONS) {
        resultMessage.textContent = "완벽합니다! 챔피언 이름을 모두 알고 있군요.";
      } else if (score >= 7) {
        resultMessage.textContent = "대단해요! 리그 오브 레전드 챔피언을 잘 알고 있네요.";
      } else if (score >= 4) {
        resultMessage.textContent = "좋은 실력이에요! 다시 도전하면 더 높은 점수를 받을 수 있어요.";
      } else {
        resultMessage.textContent = "아직 알아갈 챔피언이 많네요. 한 번 더 도전해 보세요!";
      }
    }

    nextButton.addEventListener("click", () => {
      if (!hasAnswered) return;
      currentQuestionIndex += 1;
      if (currentQuestionIndex >= TOTAL_QUESTIONS) {
        showResult();
      } else {
        showQuestion();
      }
    });

    function startGame() {
      score = 0;
      currentQuestionIndex = 0;
      questions = makeQuestions(allChampions);
      resultArea.classList.add("hidden");
      quizArea.classList.remove("hidden");
      showQuestion();
    }

    restartButton.addEventListener("click", startGame);

    async function loadChampions() {
      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) {
          throw new Error(`데이터 요청 실패 (${response.status})`);
        }

        const json = await response.json();

        // data는 객체이므로 Object.values()로 배열로 바꿉니다.
        allChampions = Object.values(json.data);

        if (allChampions.length < 4) {
          throw new Error("퀴즈를 만들 챔피언 데이터가 충분하지 않습니다.");
        }

        loadingArea.classList.add("hidden");
        startGame();
      } catch (error) {
        loadingArea.classList.add("hidden");
        errorMessage.classList.remove("hidden");
        errorMessage.textContent =
          "챔피언 데이터를 불러오지 못했습니다. 인터넷 연결을 확인하고 페이지를 다시 열어 주세요. " +
          "(HTML 파일을 브라우저에서 직접 열었는데도 문제가 계속되면 다른 브라우저에서 시도해 보세요.)";
        console.error("챔피언 데이터 로딩 오류:", error);
      }
    }

    loadChampions();
  </script>
</body>
</html>
