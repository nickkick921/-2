<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원우영 - 자기소개 & 목표</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 전체 배경 및 세로 정렬 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f4f8; /* 연한 블루-그레이 배경색 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            color: #333333;
            gap: 16px; /* 카드들 사이의 간격 */
        }

        /* 1. D-day 카드 스타일 */
        .dday-card {
            background-color: #3182ce; /* 포인트 파란색 */
            color: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 22px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(49, 130, 206, 0.25);
        }

        .dday-number {
            font-size: 40px;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -1px;
        }

        .dday-label {
            font-size: 15px;
            font-weight: 500;
            opacity: 0.95;
        }

        /* 2. 자기소개 카드 스타일 */
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .emoji {
            font-size: 64px;
            margin-bottom: 16px;
            line-height: 1;
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .bio {
            font-size: 15px;
            color: #666666;
            line-height: 1.5;
            margin-bottom: 24px;
            word-break: keep-all;
        }

        .tags-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .tag {
            background-color: #eaf2ff;
            color: #2b6cb0;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .link-btn {
            display: block;
            width: 100%;
            background-color: #3182ce;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 16px;
            border-radius: 12px;
            transition: background-color 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-btn:hover {
            background-color: #2b6cb0;
        }

        /* 3. 만다라트 목표판 스타일 */
        .mandalart-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .mandalart-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .mandalart-subtitle {
            font-size: 13px;
            color: #718096;
            margin-bottom: 18px;
        }

        .mandalart-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
        }

        .mandalart-cell {
            aspect-ratio: 1 / 1; /* 정사각형 유지 */
            background-color: #f7fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #2d3748;
            line-height: 1.35;
            word-break: keep-all;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            user-select: none;
        }

        .mandalart-cell:focus {
            background-color: #ffffff;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
        }

        /* 가운데 강조 칸 */
        .mandalart-cell.center-cell {
            background-color: #3182ce;
            color: #ffffff;
            border-color: #2b6cb0;
            font-size: 13.5px;
            font-weight: 700;
        }

        .mandalart-cell.center-cell:focus {
            background-color: #2b6cb0;
            border-color: #1a202c;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.4);
        }
    </style>

    <script>
        // ==========================================
        // 🛠️ [설정] D-day 목표 날짜 변경 (형식: YYYY-MM-DD)
        const targetDate = "2027-11-18";
        // ==========================================

        // D-day 계산 함수
        function updateDday() {
            const today = new Date();
            const target = new Date(targetDate);
            
            today.setHours(0, 0, 0, 0);
            target.setHours(0, 0, 0, 0);
            
            const diffTime = target - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            const ddayElement = document.getElementById("dday-number");
            if (diffDays > 0) {
                ddayElement.textContent = `D-${diffDays}`;
            } else if (diffDays === 0) {
                ddayElement.textContent = `D-DAY`;
            } else {
                ddayElement.textContent = `D+${Math.abs(diffDays)}`;
            }
        }

        // 페이지 로드 시 D-day 계산 및 만다라트 저장 기능 활성화
        document.addEventListener("DOMContentLoaded", function () {
            updateDday();

            const cells = document.querySelectorAll(".mandalart-cell");
            cells.forEach((cell) => {
                const index = cell.getAttribute("data-index");
                const savedText = localStorage.getItem("mandalart_cell_" + index);

                if (savedText !== null) {
                    cell.innerText = savedText;
                }

                cell.addEventListener("input", function () {
                    localStorage.setItem("mandalart_cell_" + index, cell.innerText);
                });
            });
        });
    </script>
</head>
<body>

    <!-- 1. D-day 카운터 카드 -->
    <div class="dday-card">
        <div id="dday-number" class="dday-number">D-?</div>
        <div class="dday-label">수능까지</div>
    </div>

    <!-- 2. 자기소개 카드 -->
    <div class="card">
        <div class="emoji">🌊</div>
        <h1 class="name">원우영</h1>
        <p class="bio">건축물과 자연을 좋아하는 고등학교 2학년입니다</p>

        <div class="tags-container">
            <span class="tag">⚾ 야구</span>
            <span class="tag">🎤 노래</span>
            <span class="tag">🏛️ 건축</span>
        </div>

        <a href="https://github.com/nickkick921" target="_blank" class="link-btn">
            https://github.com/nickkick921
        </a>
    </div>

    <!-- 3. 만다라트 목표판 -->
    <div class="mandalart-container">
        <h2 class="mandalart-title">🎯 나의 목표</h2>
        <p class="mandalart-subtitle">칸을 눌러서 고칠 수 있어요</p>

        <div class="mandalart-grid">
            <div class="mandalart-cell" contenteditable="true" data-index="0">매일 30분 영어 듣기</div>
            <div class="mandalart-cell" contenteditable="true" data-index="1">수학 오답노트</div>
            <div class="mandalart-cell" contenteditable="true" data-index="2">주 3회 운동</div>

            <div class="mandalart-cell" contenteditable="true" data-index="3">독서 월 2권</div>
            <div class="mandalart-cell center-cell" contenteditable="true" data-index="center">건축학과 진학</div>
            <div class="mandalart-cell" contenteditable="true" data-index="4">과학 동아리 발표</div>

            <div class="mandalart-cell" contenteditable="true" data-index="5">7시간 수면</div>
            <div class="mandalart-cell" contenteditable="true" data-index="6">봉사활동 20시간</div>
            <div class="mandalart-cell" contenteditable="true" data-index="7">코딩 포트폴리오</div>
        </div>
    </div>

</body>
</html>
